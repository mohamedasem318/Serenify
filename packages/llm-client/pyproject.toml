[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-client"
version = "0.1.0"
description = "Serenify shared LLM provider boundary: one LLMProvider adapter, file-backed prompts, scorer JSON validation, privacy-safe telemetry (Constitution Principle IV)."
readme = "README.md"
# Match the apps/api consumer ceiling (ml-video pins mediapipe<3.13, DECISION-1);
# this package has no such pin of its own, but it is installed into the API env.
requires-python = ">=3.10,<3.13"

dependencies = [
    # The provider boundary calls OpenAI-compatible chat-completions endpoints
    # (Groq + LM Studio) over plain async HTTP. Using httpx — NOT a vendor SDK —
    # keeps Principle IV's "no vendor SDK in app code" honest even inside the
    # boundary, and keeps the dependency surface minimal.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_client"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Async provider/contract tests use bare `async def` without a per-test marker.
asyncio_mode = "auto"
