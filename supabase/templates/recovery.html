<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Reset your Serenify password</title>
    <style>
      @media (prefers-color-scheme: dark) {
        body, .page { background: #101214 !important; color: #E2E5E8 !important; }
        .panel { background: #181B1E !important; border-color: #23272B !important; }
        .muted { color: #939A9F !important; }
        .divider { border-color: #23272B !important; }
        .code { background: #101214 !important; border-color: #23272B !important; color: #E2E5E8 !important; }
        .button { background: #63B292 !important; color: #101214 !important; }
      }
    </style>
  </head>
  <body style="margin:0;background:#EAEBEC;color:#1C2023;font-family:Inter,Arial,sans-serif;">
    <div class="page" style="width:100%;background:#EAEBEC;padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:collapse;">
        <tr>
          <td align="center">
            <table class="panel" role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border-collapse:collapse;background:#F4F5F6;border:1px solid #D7D9DC;border-radius:12px;">
              <tr>
                <td style="padding:28px 28px 8px;">
                  <p style="margin:0 0 16px;font:700 20px/1.2 Outfit,Inter,Arial,sans-serif;color:#3E7A63;">Serenify</p>
                  <h1 style="margin:0 0 12px;font:700 28px/1.2 Outfit,Inter,Arial,sans-serif;color:#1C2023;">Reset your password</h1>
                  <p class="muted" style="margin:0;color:#585D61;font:400 16px/1.55 Inter,Arial,sans-serif;">Use this secure link to choose a new Serenify password.</p>
                </td>
              </tr>
              <tr>
                <td style="padding:20px 28px 12px;">
                  <a class="button" href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3E7A63;color:#F8F9FA;text-decoration:none;border-radius:8px;padding:13px 18px;font:700 15px/1 Inter,Arial,sans-serif;">Reset password</a>
                </td>
              </tr>
              <tr>
                <td style="padding:8px 28px 0;">
                  <p class="muted" style="margin:0 0 10px;color:#585D61;font:400 14px/1.5 Inter,Arial,sans-serif;">Or enter this code in Serenify:</p>
                  <div class="code" style="display:inline-block;min-width:160px;background:#EAEBEC;border:1px solid #D7D9DC;border-radius:8px;padding:12px 16px;color:#1C2023;font:700 24px/1.1 Inter,Arial,sans-serif;letter-spacing:4px;text-align:center;">{{ .Token }}</div>
                </td>
              </tr>
              <tr>
                <td style="padding:24px 28px 28px;">
                  <div class="divider" style="border-top:1px solid #D7D9DC;margin-bottom:18px;"></div>
                  <p class="muted" style="margin:0;color:#585D61;font:400 13px/1.55 Inter,Arial,sans-serif;">If you did not request a password reset, you can ignore this email. The link and code expire automatically.</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
