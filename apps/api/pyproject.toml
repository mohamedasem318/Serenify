[project]
name = "serenify-api"
version = "0.1.0"
description = "Serenify anchor-extraction FastAPI service: POST /anchor (JWT-verified) + GET /healthz."
readme = "README.md"
# Python 3.12 ceiling inherited from ml-video (mediapipe==0.10.13, DECISION-1).
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # [crypto] pulls `cryptography`, required to verify Supabase's asymmetric
    # ES256 access tokens (JWKS); PyJWT cannot do EC verification without it.
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.4",
    # Feature 008 (revised D-1): a USER-CONTEXT PostgREST client only —
    # create_client(url, anon_key) + per-request postgrest.auth(<forwarded JWT>).
    # Uses the publishable anon key (RLS-respecting, not a secret); there is NO
    # service-role key. supabase-py pulls postgrest/gotrue/etc.; we use postgrest.
    "supabase>=2.6",
    "ml-video",
    # Feature 011: the shared LLM provider boundary (Principle IV). Local editable
    # path dep, same pattern as ml-video. App code calls LLMs ONLY through this — no
    # vendor SDK import in apps/api. It pulls httpx (already a dev dep here).
    "llm-client",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Feature 011: the chat orchestrator is async (parallel Ren/scorer); its tests
    # are bare `async def` under asyncio_mode=auto.
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

# ml-video is consumed as a local editable path dep. Revised D-1 (feature 008): the
# API holds NO service-role / broad DB credential — DB I/O is RLS-as-the-user via the
# forwarded JWT + the publishable anon key (preserving DECISION-9's no-broad-credential
# posture). It still verifies the JWT and extracts the anchor vector as before.
[tool.uv.sources]
ml-video = { path = "../../packages/ml-video", editable = true }
llm-client = { path = "../../packages/llm-client", editable = true }

# serenify-api is an application, not a distributable package: don't build/install
# the project root. `app` is imported via pythonpath="." (tests) / app.main:app (uvicorn).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's Depends()/File()/etc. in argument defaults is idiomatic, not a B008 bug.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
