[project]
name = "serenify-api"
version = "0.1.0"
description = "Serenify anchor-extraction FastAPI service: POST /anchor (JWT-verified) + GET /healthz."
readme = "README.md"
# Python 3.12 ceiling inherited from ml-video (mediapipe==0.10.13, DECISION-1).
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9",
    "pydantic-settings>=2.4",
    "ml-video",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

# ml-video is consumed as a local editable path dep — the API holds NO Supabase
# DB credentials (DECISION-9); it only verifies a JWT and returns the vector.
[tool.uv.sources]
ml-video = { path = "../../packages/ml-video", editable = true }

# serenify-api is an application, not a distributable package: don't build/install
# the project root. `app` is imported via pythonpath="." (tests) / app.main:app (uvicorn).
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's Depends()/File()/etc. in argument defaults is idiomatic, not a B008 bug.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
